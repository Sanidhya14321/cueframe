name: Container
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag clipkit .
