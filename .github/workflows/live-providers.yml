name: Live providers

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Provider checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Check configured providers
        run: bun run scripts/check-live-providers.ts
        env:
          LIVE_MODEL_BASE_URL: ${{ secrets.LIVE_MODEL_BASE_URL }}
          LIVE_MODEL_API_KEY: ${{ secrets.LIVE_MODEL_API_KEY }}
          LIVE_MODEL_ID: ${{ secrets.LIVE_MODEL_ID }}
          LIVE_FISH_API_KEY: ${{ secrets.LIVE_FISH_API_KEY }}
          LIVE_FISH_VOICE_ID: ${{ secrets.LIVE_FISH_VOICE_ID }}
